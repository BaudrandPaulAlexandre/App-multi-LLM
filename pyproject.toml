[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-multi-llm"
version = "0.1.0"
description = "Pipeline d'évaluation multi-LLM pour le projet ELOQUENT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Déclaration de toutes les dépendances requises (les "imports" globaux du projet)
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "gradio>=4.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]