# ============================================================
# Variante baseline ELOQUENT — Passerelle OpenRouter -> Groq
# Run "vanilla" : aucun prompt engineering, température 0
# OpenRouter sert de passerelle, l'inférence est forcée chez Groq
# via le provider routing ({"provider": {"order": ["Groq"]}}).
#
# ============================================================

run_id: "baseline_openrouter_groq_vanilla"

provider: "openrouter_groq"
# Modèle Llama 3.1 8B tel qu'exposé par OpenRouter (équivalent du
# llama-3.1-8b-instant de la baseline Groq directe).
model: "meta-llama/llama-3.1-8b-instruct"
# La clé API est lue depuis .env (OPENROUTER_API_KEY)

openrouter:
  base_url: "https://openrouter.ai/api/v1"
  provider_order: ["groq", "deepinfra/fp8"]
  allow_fallbacks: true
  # Délai (en secondes) appliqué AVANT chaque question, pour lisser le débit
  # et limiter les 429. 0 = aucun délai. Non compté dans la latence mesurée.
  request_delay_s: 0.0


languages:
  - "it"
  - "fr"

dataset_type: "specific"   # "specific" ou "unspecific"

generation:
  temperature: 0.0          # 0 = déterministe (obligatoire pour la baseline)
  max_tokens: 150           # Réponse courte (~1 phrase) 
  top_p: 1.0

prompting:
  strategy: "vanilla"      

paths:
  input_dir: "data/input"
  output_dir: "data/output/runs"

sample_seed: 42
